version: '3.8'

services:
  # ====================== PROMETHEUS ======================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring
    restart: unless-stopped

  # ====================== GRAFANA ======================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      - prometheus

  # ====================== POSTGRES EXPORTER — ORDER DB ======================
  postgres-exporter-order:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter-order
    ports:
      - "9187:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:password@host.docker.internal:5434/orderdb?sslmode=disable
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring
    restart: unless-stopped

  # ====================== POSTGRES EXPORTER — PAYMENT DB ======================
  postgres-exporter-payment:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter-payment
    ports:
      - "9188:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:password@host.docker.internal:5435/paymentdb?sslmode=disable
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring
    restart: unless-stopped

  # ====================== POSTGRES EXPORTER — USER DB ======================
  postgres-exporter-user:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter-user
    ports:
      - "9189:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:password@host.docker.internal:5432/userdb?sslmode=disable
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring
    restart: unless-stopped

  # ====================== POSTGRES EXPORTER — RESTAURANT DB ======================
  postgres-exporter-restaurant:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter-restaurant
    ports:
      - "9190:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:password@host.docker.internal:5433/restaurantdb?sslmode=disable
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring
    restart: unless-stopped

  # ====================== POSTGRES EXPORTER — NOTIFICATION DB ======================
  postgres-exporter-notification:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter-notification
    ports:
      - "9191:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:password@host.docker.internal:5436/notificationdb?sslmode=disable
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring
    restart: unless-stopped

  # ====================== RABBITMQ EXPORTER ======================
  rabbitmq-exporter:
    image: kbudde/rabbitmq-exporter:latest
    container_name: rabbitmq-exporter
    ports:
      - "9419:9419"
    environment:
      - RABBIT_URL=http://host.docker.internal:15672
      - RABBIT_USER=guest
      - RABBIT_PASSWORD=guest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring
    restart: unless-stopped

  # ====================== ZIPKIN — DISTRIBUTED TRACING ======================
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem
      - JAVA_OPTS=-Xms256m -Xmx512m
    networks:
      - monitoring
    restart: unless-stopped
    
volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge
