# ========================================
# Payment Service - Bootstrap Configuration
# ========================================
# Minimal configuration to connect to Config Server
# All other properties are fetched from config-server

server:
  port: 8084

spring:
  application:
    name: payment-service
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    config:
      fail-fast: false
      override-none: true
      allow-override: true
      override-system-properties: false
      retry:
        max-attempts: 6
        initial-interval: 1000
        multiplier: 1.1
        max-interval: 2000
  
  # Fallback PostgreSQL Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5435/paymentdb
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  
  # Fallback JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
  
  # SQL Initialization
  sql:
    init:
      mode: never
  
  # RabbitMQ Configuration
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    connection-timeout: 5000

# JWT Configuration (MUST match user-service)
jwt:
  secret: a-very-long-secure-secret-key-that-is-at-least-256-bits-for-hs256-algorithm-food-delivery-platform-2026
  expiration: 86400000
  header: Authorization
  prefix: "Bearer "

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2s
    instances:
      paymentGateway:
        baseConfig: default

  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
    instances:
      paymentGateway:
        baseConfig: default

  timelimiter:
    configs:
      default:
        timeoutDuration: 3s
    instances:
      paymentGateway:
        baseConfig: default

  bulkhead:
    instances:
      paymentGateway:
        maxConcurrentCalls: 20
        maxWaitDuration: 100ms

management:
  metrics:
    tags:
      application: payment-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
      percentiles:
        http.server.requests: 0.5, 0.75, 0.95, 0.99
  # ===== Distributed Tracing (Phase 6) =====
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,retries,bulkheads,timelimiters
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,diskSpace
        liveness:
          include: livenessState
      show-details: always
  health:
    circuitbreakers:
      enabled: true
