# ========================================
# Eureka Server - Bootstrap Configuration
# ========================================
# CRITICAL FIX: server.port MUST be set here to 8761
# Without this, Spring Boot defaults to 8080 which is occupied

server:
  port: 8761

spring:
  application:
    name: eureka-server
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    config:
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 1000
        multiplier: 1.1
        max-interval: 2000

# Eureka Server Standalone Configuration
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
  server:
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

# Management Configuration - Prevent port 8080 conflict
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,diskSpace
        liveness:
          include: livenessState
      show-details: always