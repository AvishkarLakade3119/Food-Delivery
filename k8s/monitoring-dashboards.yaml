apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: food-delivery
data:
  food-delivery-overview.json: |
    {
      "id": null,
      "uid": "food-delivery-overview",
      "title": "Food Delivery - Service Overview",
      "tags": ["food-delivery","microservices"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {"from": "now-15m", "to": "now"},
      "panels": [
        {
          "id": 1,
          "title": "Services UP",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus-uid"},
          "targets": [{"expr": "count(up{job!=\"prometheus\"} == 1)", "refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus-uid"}}]
        },
        {
          "id": 2,
          "title": "Total Requests/sec (5m)",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus-uid"},
          "targets": [{"expr": "sum(rate(http_server_requests_seconds_count[5m]))", "refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus-uid"}}],
          "fieldConfig": {"defaults": {"unit": "reqps", "decimals": 2}}
        },
        {
          "id": 3,
          "title": "Avg Response Time (5m)",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus-uid"},
          "targets": [{"expr": "sum(rate(http_server_requests_seconds_sum[5m])) / sum(rate(http_server_requests_seconds_count[5m]))", "refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus-uid"}}],
          "fieldConfig": {"defaults": {"unit": "s", "decimals": 3}}
        },
        {
          "id": 4,
          "title": "5xx Error Rate (5m)",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus-uid"},
          "targets": [{"expr": "sum(rate(http_server_requests_seconds_count{status=~\"5..\"}[5m]))", "refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus-uid"}}],
          "fieldConfig": {"defaults": {"unit": "reqps", "decimals": 2}}
        },
        {
          "id": 5,
          "title": "Request Rate per Service",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus-uid"},
          "targets": [{"expr": "sum by (application) (rate(http_server_requests_seconds_count[1m]))", "legendFormat": "{{application}}", "refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus-uid"}}],
          "fieldConfig": {"defaults": {"unit": "reqps"}}
        },
        {
          "id": 6,
          "title": "P95 Latency per Service",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus-uid"},
          "targets": [{"expr": "histogram_quantile(0.95, sum by (application, le) (rate(http_server_requests_seconds_bucket[5m])))", "legendFormat": "{{application}}", "refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus-uid"}}],
          "fieldConfig": {"defaults": {"unit": "s"}}
        },
        {
          "id": 7,
          "title": "JVM Heap Used per Service",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "datasource": {"type": "prometheus", "uid": "prometheus-uid"},
          "targets": [{"expr": "sum by (application) (jvm_memory_used_bytes{area=\"heap\"})", "legendFormat": "{{application}}", "refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus-uid"}}],
          "fieldConfig": {"defaults": {"unit": "bytes"}}
        },
        {
          "id": 8,
          "title": "CPU Usage per Service",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "datasource": {"type": "prometheus", "uid": "prometheus-uid"},
          "targets": [{"expr": "sum by (application) (process_cpu_usage)", "legendFormat": "{{application}}", "refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus-uid"}}],
          "fieldConfig": {"defaults": {"unit": "percentunit"}}
        },
        {
          "id": 9,
          "title": "Live Threads per Service",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 20},
          "datasource": {"type": "prometheus", "uid": "prometheus-uid"},
          "targets": [{"expr": "sum by (application) (jvm_threads_live_threads)", "legendFormat": "{{application}}", "refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus-uid"}}]
        },
        {
          "id": 10,
          "title": "HTTP Status Codes per Service",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 20},
          "datasource": {"type": "prometheus", "uid": "prometheus-uid"},
          "targets": [{"expr": "sum by (application, status) (rate(http_server_requests_seconds_count[1m]))", "legendFormat": "{{application}} {{status}}", "refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus-uid"}}],
          "fieldConfig": {"defaults": {"unit": "reqps"}}
        }
      ]
    }
  food-delivery-postgres.json: |
    {
      "id": null,
      "uid": "food-delivery-postgres",
      "title": "Food Delivery - PostgreSQL (HikariCP)",
      "tags": ["food-delivery","postgres"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {"from": "now-15m", "to": "now"},
      "panels": [
        {"id": 1, "title": "Total Active Connections", "type": "stat", "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus-uid"}, "targets": [{"expr": "sum(hikaricp_connections_active)", "refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus-uid"}}]},
        {"id": 2, "title": "Total Idle Connections", "type": "stat", "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus-uid"}, "targets": [{"expr": "sum(hikaricp_connections_idle)", "refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus-uid"}}]},
        {"id": 3, "title": "Total Pool Size", "type": "stat", "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus-uid"}, "targets": [{"expr": "sum(hikaricp_connections)", "refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus-uid"}}]},
        {"id": 4, "title": "Pending Threads", "type": "stat", "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus-uid"}, "targets": [{"expr": "sum(hikaricp_connections_pending)", "refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus-uid"}}]},
        {"id": 5, "title": "Active Connections per Service", "type": "timeseries", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4}, "datasource": {"type": "prometheus", "uid": "prometheus-uid"}, "targets": [{"expr": "sum by (application) (hikaricp_connections_active)", "legendFormat": "{{application}}", "refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus-uid"}}]},
        {"id": 6, "title": "Idle Connections per Service", "type": "timeseries", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4}, "datasource": {"type": "prometheus", "uid": "prometheus-uid"}, "targets": [{"expr": "sum by (application) (hikaricp_connections_idle)", "legendFormat": "{{application}}", "refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus-uid"}}]},
        {"id": 7, "title": "Pool Size per Service", "type": "timeseries", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12}, "datasource": {"type": "prometheus", "uid": "prometheus-uid"}, "targets": [{"expr": "sum by (application) (hikaricp_connections)", "legendFormat": "{{application}}", "refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus-uid"}}]},
        {"id": 8, "title": "Pending Threads per Service", "type": "timeseries", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12}, "datasource": {"type": "prometheus", "uid": "prometheus-uid"}, "targets": [{"expr": "sum by (application) (hikaricp_connections_pending)", "legendFormat": "{{application}}", "refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus-uid"}}]},
        {"id": 9, "title": "Connection Acquire Time (max)", "type": "timeseries", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 20}, "datasource": {"type": "prometheus", "uid": "prometheus-uid"}, "targets": [{"expr": "max by (application) (hikaricp_connections_acquire_seconds_max)", "legendFormat": "{{application}}", "refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus-uid"}}], "fieldConfig": {"defaults": {"unit": "s"}}},
        {"id": 10, "title": "Connection Timeouts", "type": "timeseries", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 20}, "datasource": {"type": "prometheus", "uid": "prometheus-uid"}, "targets": [{"expr": "sum by (application) (rate(hikaricp_connections_timeout_total[5m]))", "legendFormat": "{{application}}", "refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus-uid"}}]}
      ]
    }
  food-delivery-rabbitmq.json: |
    {
      "id": null,
      "uid": "food-delivery-rabbitmq",
      "title": "Food Delivery - RabbitMQ (Spring AMQP)",
      "tags": ["food-delivery","rabbitmq"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {"from": "now-15m", "to": "now"},
      "panels": [
        {"id": 1, "title": "Total Connections", "type": "stat", "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus-uid"}, "targets": [{"expr": "sum(rabbitmq_connections)", "refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus-uid"}}]},
        {"id": 2, "title": "Total Channels", "type": "stat", "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus-uid"}, "targets": [{"expr": "sum(rabbitmq_channels)", "refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus-uid"}}]},
        {"id": 3, "title": "Published/sec (5m)", "type": "stat", "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus-uid"}, "targets": [{"expr": "sum(rate(rabbitmq_published_total[5m]))", "refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus-uid"}}], "fieldConfig": {"defaults": {"unit": "reqps"}}},
        {"id": 4, "title": "Consumed/sec (5m)", "type": "stat", "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus-uid"}, "targets": [{"expr": "sum(rate(rabbitmq_consumed_total[5m]))", "refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus-uid"}}], "fieldConfig": {"defaults": {"unit": "reqps"}}},
        {"id": 5, "title": "Publish Rate per Service", "type": "timeseries", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4}, "datasource": {"type": "prometheus", "uid": "prometheus-uid"}, "targets": [{"expr": "sum by (application) (rate(rabbitmq_published_total[1m]))", "legendFormat": "{{application}}", "refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus-uid"}}], "fieldConfig": {"defaults": {"unit": "reqps"}}},
        {"id": 6, "title": "Consume Rate per Service", "type": "timeseries", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4}, "datasource": {"type": "prometheus", "uid": "prometheus-uid"}, "targets": [{"expr": "sum by (application) (rate(rabbitmq_consumed_total[1m]))", "legendFormat": "{{application}}", "refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus-uid"}}], "fieldConfig": {"defaults": {"unit": "reqps"}}},
        {"id": 7, "title": "Acknowledged Rate", "type": "timeseries", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12}, "datasource": {"type": "prometheus", "uid": "prometheus-uid"}, "targets": [{"expr": "sum by (application) (rate(rabbitmq_acknowledged_total[1m]))", "legendFormat": "{{application}}", "refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus-uid"}}]},
        {"id": 8, "title": "Rejected/Failed Rate", "type": "timeseries", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12}, "datasource": {"type": "prometheus", "uid": "prometheus-uid"}, "targets": [{"expr": "sum by (application) (rate(rabbitmq_rejected_total[1m]))", "legendFormat": "{{application}}", "refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus-uid"}}]},
        {"id": 9, "title": "Connections per Service", "type": "timeseries", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 20}, "datasource": {"type": "prometheus", "uid": "prometheus-uid"}, "targets": [{"expr": "sum by (application) (rabbitmq_connections)", "legendFormat": "{{application}}", "refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus-uid"}}]},
        {"id": 10, "title": "Channels per Service", "type": "timeseries", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 20}, "datasource": {"type": "prometheus", "uid": "prometheus-uid"}, "targets": [{"expr": "sum by (application) (rabbitmq_channels)", "legendFormat": "{{application}}", "refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus-uid"}}]}
      ]
    }
