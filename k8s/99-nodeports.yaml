apiVersion: v1
kind: Service
metadata:
  name: api-gateway-external
  namespace: food-delivery
  labels:
    app: api-gateway
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 8443
      targetPort: 8443
      nodePort: 30443
      protocol: TCP
      name: https
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-external
  namespace: food-delivery
spec:
  type: NodePort
  selector:
    app: rabbitmq
  ports:
    - port: 15672
      targetPort: 15672
      nodePort: 30672
      protocol: TCP
      name: management
---
apiVersion: v1
kind: Service
metadata:
  name: zipkin-external
  namespace: food-delivery
spec:
  type: NodePort
  selector:
    app: zipkin
  ports:
    - port: 9411
      targetPort: 9411
      nodePort: 30411
      protocol: TCP