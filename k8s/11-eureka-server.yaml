apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: food-delivery
  labels:
    app: eureka-server
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: eureka-server
        tier: backend
    spec:
      containers:
        - name: eureka-server
          image: avishkarlakade/eureka-server:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: EUREKA_CLIENT_REGISTERWITHEUREKA
              value: "false"
            - name: EUREKA_CLIENT_FETCHREGISTRY
              value: "false"
            - name: SPRING_CLOUD_CONFIG_URI
              value: "http://config-server:8888"
            - name: SPRING_CLOUD_CONFIG_FAIL_FAST
              value: "false"          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"

          ports:
            - containerPort: 8761
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: food-delivery
  labels:
    app: eureka-server
spec:
  type: ClusterIP
  selector:
    app: eureka-server          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"

  ports:
    - port: 8761
      targetPort: 8761
      protocol: TCP
      name: http