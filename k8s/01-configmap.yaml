apiVersion: v1
kind: ConfigMap
metadata:
  name: shared-config
  namespace: food-delivery
data:
  # Service Discovery
  EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

  # Config Server
  SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
  SPRING_CLOUD_CONFIG_FAIL_FAST: "false"

  # Infrastructure (using cluster services)
  SPRING_RABBITMQ_HOST: "rabbitmq"
  SPRING_RABBITMQ_PORT: "5672"
  SPRING_RABBITMQ_USERNAME: "guest"
  SPRING_RABBITMQ_PASSWORD: "guest"

  # Observability
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: "http://zipkin:9411/api/v2/spans"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus,gateway,circuitbreakers"

  # Database (shared PostgreSQL service)
  SPRING_DATASOURCE_USERNAME: "postgres"
  SPRING_DATASOURCE_PASSWORD: "postgres"