# Docker profile configuration for user-service
# Use this when running inside Docker containers
# Activate with: SPRING_PROFILES_ACTIVE=docker

spring:
  datasource:
    url: jdbc:postgresql://user-db:5432/userdb
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always