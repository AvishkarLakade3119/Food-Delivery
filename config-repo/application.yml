management:
  server:
    port: 8444

# ========================================
# Common Configuration for All Microservices
# ========================================
# Shared properties for ALL services in the Food Delivery platform.

# Common Eureka Client Configuration
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

# Common Actuator + Tracing Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh,circuitbreakers,retries,bulkheads,timelimiters,ratelimiters,gateway
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    refresh:
      enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.75, 0.95, 0.99
  # ===== DISTRIBUTED TRACING (Phase 6) =====
  tracing:
    enabled: true
    sampling:
      probability: 1.0   # 100% sampling for dev. Use 0.1 in production.
    baggage:
      remote-fields:
        - x-correlation-id
        - x-tenant-id
      correlation:
        enabled: true
        fields:
          - x-correlation-id
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  observations:
    annotations:
      enabled: true

# Common Spring Configuration
spring:
  # JPA Common Settings
  jpa:
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # Jackson Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: UTC

  # Common HTTP Configuration
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

  # ===== RABBITMQ TRACING (Phase 6) =====
  rabbitmq:
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true

  # ===== OPENFEIGN TRACING (Phase 6) =====
  cloud:
    openfeign:
      micrometer:
        enabled: true

# Common Logging Configuration WITH TRACE IDs (Phase 6)
logging:
  level:
    root: INFO
    com.fooddelivery: DEBUG
    org.springframework.web: INFO
    org.springframework.cloud: INFO
    org.hibernate: INFO
    io.micrometer.tracing: INFO
    zipkin2: INFO
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p ${PID:- } --- [%t] [%X{traceId:-},%X{spanId:-}] %-40.40logger{39} : %m%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p ${PID:- } --- [%t] [%X{traceId:-},%X{spanId:-}] %-40.40logger{39} : %m%n"
  file:
    name: logs/${spring.application.name}.log
    max-size: 10MB
    max-history: 30