# ========================================
# Eureka Server Configuration
# ========================================
# Service Discovery Server Configuration

server:
  port: 8761

spring:
  application:
    name: eureka-server

# Management/Actuator Configuration
# Fix: Prevent port 8080 conflict by disabling separate management server

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: eureka-server
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.75, 0.95, 0.99
