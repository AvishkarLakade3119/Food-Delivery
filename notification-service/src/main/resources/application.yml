# ========================================
# Notification Service - Application Configuration
# ========================================

server:
  port: 8086

spring:
  application:
    name: notification-service
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    config:
      fail-fast: false
      override-none: true
      allow-override: true
      override-system-properties: false
      retry:
        max-attempts: 6
        initial-interval: 1000
        multiplier: 1.1
        max-interval: 2000

  # PostgreSQL Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5436/notificationdb
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  # JPA/Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # SQL Initialization
  sql:
    init:
      mode: never
  
  # RabbitMQ Configuration
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    connection-timeout: 5000

# JWT Configuration (MUST match user-service)
jwt:
  secret: a-very-long-secure-secret-key-that-is-at-least-256-bits-for-hs256-algorithm-food-delivery-platform-2026
  expiration: 86400000
  header: Authorization
  prefix: "Bearer "

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# Logging Configuration
logging:
  level:
    com.fooddelivery.notification: INFO
    org.hibernate.SQL: DEBUG

# ===== Phase 8: K8s liveness/readiness probes =====
management:
  metrics:
    tags:
      application: notification-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
      percentiles:
        http.server.requests: 0.5, 0.75, 0.95, 0.99
  # ===== Distributed Tracing (Phase 6) =====
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,diskSpace
        liveness:
          include: livenessState

