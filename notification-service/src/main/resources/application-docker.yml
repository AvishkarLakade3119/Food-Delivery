# Docker profile configuration for notification-service
# Use this when running inside Docker containers
# Activate with: SPRING_PROFILES_ACTIVE=docker
# Note: Notification service uses H2 in both local and Docker environments

spring:
  datasource:
    url: jdbc:h2:mem:notificationdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  sql:
    init:
      mode: always