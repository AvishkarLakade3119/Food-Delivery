# Test configuration for Notification Service

# JWT Configuration for tests
jwt:
  secret: test-secret-key-that-is-at-least-256-bits-for-hs256-algorithm-testing-purpose-only
  expiration: 86400000
  header: Authorization
  prefix: "Bearer "

spring:
  application:
    name: notification-service
  config:
    import: ""
  datasource:
    url: jdbc:h2:mem:notifmain;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never
  cloud:
    discovery:
      enabled: false
    config:
      enabled: false

eureka:
  client:
    enabled: false

management:
  endpoints:
    enabled-by-default: false

server:
  port: 0