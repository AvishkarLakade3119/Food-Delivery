# Test configuration for API Gateway
# Uses random port to avoid conflicts with running Minikube pod
server:
  port: 0

management:
  server:
    port: -1  # Disable management server port entirely for tests

spring:
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
    discovery:
      enabled: false
    gateway:
      routes: []
  config:
    import: "optional:configserver:"
  main:
    web-application-type: reactive

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false