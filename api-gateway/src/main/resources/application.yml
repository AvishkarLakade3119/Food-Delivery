server:
  port: 8081

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
        - id: user-auth-service
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**
        - id: restaurant-service
          uri: lb://restaurant-service
          predicates:
            - Path=/api/restaurants/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
        - id: menu-items-service
          uri: lb://restaurant-service
          predicates:
            - Path=/api/menu-items/**
        # Direct service health endpoints
        - id: user-service-actuator
          uri: lb://user-service
          predicates:
            - Path=/user-service/actuator/**
          filters:
            - StripPrefix=1
        - id: restaurant-service-actuator
          uri: lb://restaurant-service
          predicates:
            - Path=/restaurant-service/actuator/**
          filters:
            - StripPrefix=1
        - id: order-service-actuator
          uri: lb://order-service
          predicates:
            - Path=/order-service/actuator/**
          filters:
            - StripPrefix=1
        - id: payment-service-actuator
          uri: lb://payment-service
          predicates:
            - Path=/payment-service/actuator/**
          filters:
            - StripPrefix=1
        - id: notification-service-actuator
          uri: lb://notification-service
          predicates:
            - Path=/notification-service/actuator/**
          filters:
            - StripPrefix=1
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:4200"
              - "http://localhost:8080"
              - "http://localhost:8081"
              - "http://localhost:8082"
              - "http://localhost:8083"
              - "http://localhost:8084"
              - "http://localhost:8085"
              - "http://localhost:8086"
            allowedMethods:
              - "GET"
              - "POST"
              - "PUT"
              - "DELETE"
              - "OPTIONS"
              - "HEAD"
              - "PATCH"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 30
  instance:
    prefer-ip-address: true
    hostname: localhost
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
      validate-group-membership: false
      group:
        readiness:
          include: ping
        liveness:
          include: ping